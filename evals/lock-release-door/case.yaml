schema_version: "1.1"
name: lock-release-door
context:
  scaffold_script: place-files.sh
expected_outcome: |
  release.py (или новая дверь) выпускает только с вердиктом, у которого sha256 совпадает с файлом, судья отработал
  и судья не автор; копия в dist сверена по sha. Цель hotfix больше не кладёт в dist мимо двери или заперта.
  Есть тест обходов с числом прошедших проверок. Исторический случай (файл изменён после ревью) получает отказ,
  законный путь проходит. Ответ владельцу простыми словами: что заперто, что осталось, один вопрос.
