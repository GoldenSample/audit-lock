schema_version: "1.1"
name: audit-finds-text-only-rule
context:
  scaffold_script: place-files.sh
expected_outcome: |
  AUDIT.md, with path:line support, finds three things: the hotfix target in the Makefile copies the firmware to dist around release.py;
  release.py checks the approved field, which build.py fills in itself (a paperwork check, reviewer = author);
  the rule "after an edit, review again" is held nowhere, and the verdict is not bound to the file's content.
  A lock is proposed: a single release door with a verdict bound to the sha256, and a hook or check on the side door.
  SUMMARY.md starts with the point in one sentence and ends with one question with a recommendation. The repo's code is unchanged.
