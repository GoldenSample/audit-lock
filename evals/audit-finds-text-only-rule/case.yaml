schema_version: "1.1"
name: audit-finds-text-only-rule
context:
  scaffold_script: place-files.sh
expected_outcome: |
  AUDIT.md с опорой путь:строка находит три вещи: цель hotfix в Makefile копирует прошивку в dist мимо release.py;
  release.py проверяет поле approved, которое заполняет сам build.py (проверка бумаги, ревьюер = автор);
  правило «после правки ревью заново» нигде не держится, вердикт не привязан к содержимому файла.
  Предложен замок: единственная дверь выпуска с вердиктом по sha256 и хук или проверка на боковую дверь.
  SUMMARY.md начинается со смысла одной фразой и заканчивается одним вопросом с рекомендацией. Код репо не изменён.
